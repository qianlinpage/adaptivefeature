<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Adaptive Feature: An iterative dialogue between abstract theory and neural networks</title>
<desc id="desc">Start with a family of abstract feature-map regressions. Use fine-grained risk, ESD, FEM and tractable models to study the quality and risk of fixed representations, local coupling between spectral structure and coefficients, and the formation and retention of features over training. In concrete networks, distinguish feature spectra and empirical target alignment, frozen-feature prediction after refitting on independent data, and the original network’s generalization. Use this feedback to refine the family assumptions and repeat. The research objective is to connect neural-network dynamics and generalization.</desc>
