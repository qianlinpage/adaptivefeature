<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">Adaptive Feature: 抽象理论与神经网络的迭代对话</title>
<desc id="desc">从一族抽象特征映射回归出发，以精细风险、ESD、FEM和可解析模型为工具，研究固定表示的质量与风险、局部谱结构与预测系数的耦合、整体训练中特征的形成与保持。在具体神经网络中分别观察特征谱与经验目标匹配、冻结特征后独立重拟合的能力及原网络的泛化表现，反馈并修正特征映射族的假设，再次分析。研究目标是逐步建立神经网络动力学与泛化能力的关系。</desc>
